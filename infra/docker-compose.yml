services:

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./app:/srv/app:ro          # i file statici della PWA
      - caddy_data:/data           # certificati: NON cancellare
      - caddy_config:/config
    environment:
      - DOMINIO=${DOMINIO}
      - EMAIL=${EMAIL}
    networks: [esterna]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=n8n
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=n8n
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n"]
      interval: 10s
      retries: 5
    networks: [interna]        # nessun accesso a internet, in nessuna direzione

  n8n:
    image: docker.n8n.io/n8nio/n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # --- rete e URL pubblici ---
      - N8N_HOST=${DOMINIO}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://${DOMINIO}/
      - N8N_EDITOR_BASE_URL=https://${DOMINIO}/
      - N8N_SECURE_COOKIE=true
      - N8N_PROXY_HOPS=1

      # --- segreti ---
      # Senza questa chiave le credenziali salvate sono irrecuperabili.
      # Conservane una copia fuori dal server.
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}

      # --- fuso orario ---
      - GENERIC_TIMEZONE=Europe/Rome
      - TZ=Europe/Rome

      # --- database ---
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}

      # --- storico esecuzioni ---
      # Con il polling attivo si producono decine di migliaia di esecuzioni al
      # mese. Salvare solo gli errori riduce le scritture di oltre il 99% e non
      # perde nulla di utile: le esecuzioni riuscite non le guarderai mai.
      # In fase di sviluppo di un workflow rimetti SAVE_ON_SUCCESS=all.
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=none
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_ON_PROGRESS=false
      - EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS=false
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
      - EXECUTIONS_DATA_PRUNE_MAX_COUNT=10000

      # --- varie ---
      - N8N_RUNNERS_ENABLED=true      # richiesto dalle 1.x, ignorato dalle 2.x
      - N8N_DIAGNOSTICS_ENABLED=false

      # Da attivare solo se metti basic_auth su Caddy davanti all'editor:
      # l'autenticazione base può rompere il canale push in websocket.
      # - N8N_PUSH_BACKEND=sse
    volumes:
      - n8n_data:/home/node/.n8n
    networks: [interna, esterna]      # deve poter uscire verso Telegram, Google, ecc.

volumes:
  pg_data:
  n8n_data:
  caddy_data:
  caddy_config:

networks:
  interna:
    internal: true
  esterna:
