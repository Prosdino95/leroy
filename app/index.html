<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- connect-src 'self': l'API è sulla stessa origine. Se un giorno finisce su
     un dominio diverso va aggiornato qui, altrimenti le chiamate vengono
     bloccate. 'unsafe-inline' serve solo agli stili, per l'attributo style
     sulle barre del budget. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; base-uri 'none'; object-src 'none'; form-action 'none'">
<title>Finanze</title>
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Finanze">
<link rel="manifest" href="manifest.json" crossorigin="use-credentials">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ App ============ -->
<div class="app" id="app" hidden>

  <header class="topbar">
    <div class="wrap">

      <div class="barra-alta">
        <div class="segmented" id="tipoSel">
          <button type="button" class="seg" data-tipo="giorno">Giorno</button>
          <button type="button" class="seg" data-tipo="mese">Mese</button>
          <button type="button" class="seg" data-tipo="anno">Anno</button>
        </div>
        <div class="barra-azioni">
          <button type="button" class="icona-btn" id="btnPrivacy" aria-pressed="false"
                  aria-label="Nascondi importi" title="Nascondi importi">
            <svg class="ico-occhio" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M1.8 12S6 5.4 12 5.4 22.2 12 22.2 12S18 18.6 12 18.6 1.8 12 1.8 12z"/>
              <circle cx="12" cy="12" r="3.1"/>
            </svg>
            <svg class="ico-occhio-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
              <path d="M9.9 5.7A9.6 9.6 0 0 1 12 5.4c6 0 10.2 6.6 10.2 6.6a19 19 0 0 1-2.5 3.4"/>
              <path d="M6.4 7.5A18.6 18.6 0 0 0 1.8 12S6 18.6 12 18.6c1.6 0 3-.4 4.2-1"/>
              <path d="M9.9 9.9a3.1 3.1 0 0 0 4.3 4.3"/>
              <path d="M3.5 3.5l17 17"/>
            </svg>
          </button>
          <button type="button" class="icona-btn" id="btnAggiorna" aria-label="Aggiorna" title="Aggiorna">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3.5 12a8.5 8.5 0 0 1 14.6-5.9"/><path d="M18.6 3v3.6H15"/>
              <path d="M20.5 12a8.5 8.5 0 0 1-14.6 5.9"/><path d="M5.4 21v-3.6H9"/>
            </svg>
          </button>
          <button type="button" class="icona-btn" id="btnImpostazioni" aria-label="Impostazioni" title="Impostazioni">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
              <circle cx="12" cy="12" r="6.2"/><circle cx="12" cy="12" r="2.4"/>
              <g stroke-width="3"><path d="M12 2.3v2.6M12 19.1v2.6M2.3 12h2.6M19.1 12h2.6M5.15 5.15 7 7M17 17l1.85 1.85M18.85 5.15 17 7M7 17l-1.85 1.85"/></g>
            </svg>
          </button>
        </div>
      </div>

      <div class="periodo">
        <button type="button" class="icona-btn" id="periodoPrec" aria-label="Periodo precedente">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <button type="button" class="periodo-lab" id="periodoLabel" title="Torna al periodo corrente"></button>
        <button type="button" class="icona-btn" id="periodoSucc" aria-label="Periodo successivo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
        </button>
      </div>

      <nav class="tabs" id="tabs">
        <button type="button" class="tab" data-vista="riepilogo" aria-selected="true">Riepilogo</button>
        <button type="button" class="tab" data-vista="movimenti" aria-selected="false">Movimenti</button>
      </nav>

    </div>
  </header>

  <main class="main">
    <div class="wrap">
      <section class="vista" id="vistaRiepilogo" aria-label="Riepilogo"></section>
      <section class="vista" id="vistaMovimenti" aria-label="Movimenti" hidden>
        <div class="ricerca">
          <input id="ricercaQ" type="search" inputmode="search" autocomplete="off" spellcheck="false"
                 enterkeyhint="search" placeholder="Cerca in tutto lo storico" aria-label="Cerca movimenti">
          <p class="ricerca-riga" id="ricercaRiga" hidden></p>
          <div class="ricerca-cat" id="ricercaCat" hidden></div>
        </div>
        <div id="listaMovimenti"></div>
      </section>
    </div>
  </main>

  <button type="button" class="fab" id="fab" aria-label="Aggiungi movimento">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>

</div>

<!-- ============ Configurazione / Impostazioni ============ -->
<div class="schermata" id="schermataConfig" hidden>
  <div class="wrap">
    <header class="schermata-head" id="cfgHead">
      <h1 id="cfgTitolo">Impostazioni</h1>
      <button type="button" class="btn testo" id="cfgChiudi" hidden>Chiudi</button>
    </header>

    <!-- Solo al primo avvio, al posto dell'intestazione. -->
    <div class="cfg-benvenuto" id="cfgIntro" hidden>
      <svg class="cfg-logo" viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="112.64" fill="#14161A"/><rect x="158.7" y="128.0" width="66.6" height="256.0" rx="30.7" fill="#F2F0EB"/><rect x="158.7" y="317.4" width="194.6" height="66.6" rx="30.7" fill="#F2F0EB"/><circle cx="317.4" cy="174.1" r="38.4" fill="#39B98A"/></svg>
      <h1>Collega Leroy</h1>
      <p>Inserisci l'indirizzo dell'API e il token. Restano salvati solo su questo dispositivo.</p>
    </div>

    <p class="avviso" id="cfgAvviso" hidden></p>

    <!-- Riepilogo della connessione salvata: i campi restano nascosti
         finché non si sceglie di modificarla. -->
    <section class="cfg-stato" id="cfgStato" hidden>
      <div class="cfg-stato-head">
        <span class="cfg-pallino" id="cfgPallino"></span>
        <div>
          <p class="cfg-stato-tit" id="cfgStatoTit"></p>
          <p class="cfg-host" id="cfgHost"></p>
        </div>
      </div>
      <dl class="cfg-righe">
        <div><dt>Token</dt><dd id="cfgTokenMask"></dd></div>
        <div id="cfgRigaAccess"><dt>Cloudflare Access</dt><dd id="cfgAccessStato"></dd></div>
      </dl>
      <button type="button" class="btn" id="cfgModifica">Modifica connessione</button>
    </section>

    <form id="formConfig" novalidate>
      <h2 class="cfg-gruppo-tit">Server</h2>
      <div class="cfg-gruppo">
        <label class="campo">
          <span class="campo-lab">URL dell'API</span>
          <input id="cfgUrl" type="url" inputmode="url" autocomplete="off" spellcheck="false"
                 placeholder="https://esempio.duckdns.org/webhook/api-xxxx" required>
        </label>
        <label class="campo">
          <span class="campo-lab">Token</span>
          <span class="campo-affiancato">
            <input id="cfgToken" type="password" autocomplete="off" spellcheck="false" required>
            <button type="button" class="btn testo" data-vedi="cfgToken">Mostra</button>
          </span>
        </label>
      </div>

      <div id="cfgAccess" hidden>
        <h2 class="cfg-gruppo-tit">Cloudflare Access</h2>
        <div class="cfg-gruppo">
          <p class="nota">Service token. Lascia vuoto se l'API non è dietro Access.</p>
          <label class="campo">
            <span class="campo-lab">Client ID</span>
            <input id="cfgAccessId" type="text" autocomplete="off" spellcheck="false"
                   placeholder="xxxxxxxx.access">
          </label>
          <label class="campo">
            <span class="campo-lab">Client Secret</span>
            <span class="campo-affiancato">
              <input id="cfgAccessSecret" type="password" autocomplete="off" spellcheck="false">
              <button type="button" class="btn testo" data-vedi="cfgAccessSecret">Mostra</button>
            </span>
          </label>
        </div>
      </div>

      <p class="errore-inline" id="cfgErrore" hidden></p>
      <div class="cfg-azioni">
        <button type="submit" class="btn primario" id="cfgSalva">Salva</button>
        <button type="button" class="btn testo" id="cfgAnnulla" hidden>Annulla</button>
      </div>
    </form>

    <div class="schermata-piede">
      <button type="button" class="btn pericolo" id="cfgCancella">Cancella configurazione</button>
      <p class="versione" id="versione"></p>
    </div>
  </div>
</div>

<!-- ============ Fogli ============ -->
<div class="velo" id="velo" hidden></div>

<div class="foglio" id="foglioInserisci" hidden role="dialog" aria-modal="true" aria-labelledby="titInserisci">
  <div class="foglio-head">
    <h2 id="titInserisci">Nuovo movimento</h2>
    <button type="button" class="icona-btn" data-chiudi aria-label="Chiudi">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <form class="foglio-corpo" id="formInserisci" novalidate>
    <label class="campo">
      <span class="campo-lab">Importo</span>
      <input id="insImporto" class="input-grande" type="text" inputmode="decimal" autocomplete="off" placeholder="0,00" required>
    </label>
    <div class="campo">
      <span class="campo-lab">Tipo</span>
      <div class="segmented" id="insTipo">
        <button type="button" class="seg attivo" data-tipo="spesa">Spesa</button>
        <button type="button" class="seg" data-tipo="entrata">Entrata</button>
      </div>
    </div>
    <label class="campo">
      <span class="campo-lab">Categoria</span>
      <select id="insCategoria" required></select>
    </label>
    <label class="campo">
      <span class="campo-lab">Conto</span>
      <select id="insConto"></select>
    </label>
    <label class="campo">
      <span class="campo-lab">Descrizione</span>
      <input id="insDescrizione" type="text" autocomplete="off" placeholder="Opzionale">
    </label>
    <label class="campo">
      <span class="campo-lab">Data</span>
      <input id="insData" type="date">
    </label>
    <p class="errore-inline" id="insErrore" hidden></p>
    <button type="submit" class="btn primario" id="insInvia" disabled>Aggiungi</button>
  </form>
</div>

<div class="foglio" id="foglioDettaglio" hidden role="dialog" aria-modal="true" aria-labelledby="titDettaglio">
  <div class="foglio-head">
    <h2 id="titDettaglio">Movimento</h2>
    <button type="button" class="icona-btn" data-chiudi aria-label="Chiudi">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="foglio-corpo">
    <label class="campo" for="dettImporto">
      <span class="campo-lab">Importo</span>
      <span class="dett-importo-riga" id="dettImportoRiga">
        <span class="dett-segno" id="dettSegno" aria-hidden="true"></span>
        <input id="dettImporto" class="input-grande" type="text" inputmode="decimal"
               autocomplete="off" aria-label="Importo" required>
        <span class="dett-valuta" aria-hidden="true">€</span>
      </span>
    </label>
    <dl class="dett-lista" id="dettLista"></dl>
    <label class="campo">
      <span class="campo-lab">Categoria</span>
      <select id="dettCategoria"></select>
    </label>
    <p class="errore-inline" id="dettErrore" hidden></p>
    <button type="button" class="btn primario" id="dettConferma">Conferma</button>
    <div class="foglio-pericolo">
      <button type="button" class="btn pericolo" id="dettElimina" aria-label="Elimina movimento">Elimina</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script type="module" src="app.js"></script>
</body>
</html>
